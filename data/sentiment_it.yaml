# Lessico di valenza per il tono dei titoli (italiano).
# Metodo "tone-lexicon-v1": somma delle valenze delle parole trovate nel
# titolo, normalizzata. Mostrato SOLO come distribuzione per fonte, mai come
# giudizio sul singolo articolo. Scala: -2 (molto negativo) .. +2 (molto positivo).
# Ampliabile via pull request: ogni voce deve essere una parola da titolo
# di giornale, non gergo raro.
