# data/lexicon_it.yaml
# Lessico di framing della stampa italiana — gruppi di termini con stessa
# denotazione e connotazione diversa, come usati nei titoli dei giornali.
# Progetto Open News — seed iniziale. Tutte le note in italiano.
# Le fonti citate sono solo quelle reali e verificabili; dove non certe, omesse.
version: 1
language: it
groups:
  - id: migranti_senza_permesso
    denotation: persone straniere presenti sul territorio senza un titolo di soggiorno valido
    topic: immigrazione
    terms:
      - term: clandestino
        connotation: negativo
        note: suggerisce segretezza e intenzione criminale, criminalizza la condizione amministrativa
      - term: irregolare
        connotation: tecnico
        note: descrive la posizione giuridica senza attribuire colpa morale
      - term: migrante senza documenti
        connotation: neutro
        note: descrizione fattuale della condizione, calco del francese sans-papiers
      - term: straniero non in regola
        connotation: neutro
        note: formula burocratica usata in cronaca per evitare termini marcati
    rationale: la scelta tra condizione giuridica e stigma criminale orienta il lettore prima ancora dei fatti
    added_by: seed iniziale del progetto
    references: ["Carta di Roma (2008)"]

  - id: persone_in_fuga
    denotation: persone che lasciano il proprio paese e arrivano in Italia
    topic: immigrazione
    terms:
      - term: migrante
        connotation: neutro
        note: termine generico che non specifica motivazioni o status
      - term: profugo
        connotation: enfatico
        note: evoca fuga da guerre e catastrofi, suscita compassione
      - term: rifugiato
        connotation: tecnico
        note: status giuridico riconosciuto ai sensi della Convenzione di Ginevra
      - term: richiedente asilo
        connotation: tecnico
        note: indica una procedura in corso, non un esito
      - term: disperato
        connotation: enfatico
        note: pietismo che riduce la persona alla sua condizione
    rationale: alternare status giuridici e etichette emotive sposta la cornice tra diritto e pietà o allarme
    added_by: seed iniziale del progetto
    references: ["Carta di Roma (2008)"]

  - id: arrivi_via_mare
    denotation: arrivo di migranti sulle coste italiane via mare
    topic: immigrazione
    terms:
      - term: sbarchi
        connotation: neutro
        note: termine ormai standard ma con eco quasi militare
      - term: arrivi via mare
        connotation: neutro
        note: descrizione fattuale preferita dai manuali di deontologia
      - term: flussi migratori
        connotation: tecnico
        note: lessico statistico-amministrativo che spersonalizza
      - term: invasione
        connotation: negativo
        note: metafora bellica che presenta i migranti come nemici
      - term: ondata
        connotation: enfatico
        note: metafora idraulica che suggerisce forza incontrollabile
    rationale: le metafore idrauliche e belliche trasformano un fenomeno amministrativo in minaccia esistenziale
    added_by: seed iniziale del progetto
    references: ["Carta di Roma (2008)"]

  - id: navi_soccorso
    denotation: navi di organizzazioni non governative che soccorrono migranti nel Mediterraneo
    topic: immigrazione
    terms:
      - term: navi umanitarie
        connotation: positivo
        note: mette in primo piano la finalità di soccorso
      - term: navi ong
        connotation: neutro
        note: indica solo la natura del soggetto armatore
      - term: taxi del mare
        connotation: negativo
        note: espressione polemica che insinua complicità con i trafficanti
    rationale: la stessa nave può essere presentata come soccorritrice o complice a seconda del termine
    added_by: seed iniziale del progetto

  - id: prelievo_fiscale
    denotation: prelievo obbligatorio di denaro da parte dello Stato
    topic: economia
    terms:
      - term: imposta
        connotation: tecnico
        note: termine giuridico corretto per i prelievi senza controprestazione diretta
      - term: tassa
        connotation: neutro
        note: uso comune generico, tecnicamente indica prelievi legati a un servizio
      - term: tributo
        connotation: tecnico
        note: iperonimo giuridico usato nei testi normativi
      - term: balzello
        connotation: negativo
        note: arcaismo che evoca prelievi arbitrari e vessatori
      - term: stangata
        connotation: negativo
        note: presenta il prelievo come colpo inferto al cittadino
      - term: prelievo
        connotation: neutro
        note: formula asettica che attenua la percezione del costo
    rationale: dal linguaggio giuridico alla metafora del colpo, il termine decide se lo Stato riscuote o aggredisce
    added_by: seed iniziale del progetto

  - id: legge_di_bilancio
    denotation: legge annuale che definisce entrate e spese dello Stato
    topic: economia
    terms:
      - term: legge di bilancio
        connotation: tecnico
        note: denominazione ufficiale attuale
      - term: manovra
        connotation: neutro
        note: uso giornalistico consolidato, con lieve sfumatura di aggiustamento emergenziale
      - term: finanziaria
        connotation: neutro
        note: denominazione storica rimasta nel lessico comune
      - term: manovra lacrime e sangue
        connotation: negativo
        note: formula enfatica per manovre percepite come punitive
    rationale: la scelta tra nome ufficiale e formule drammatizzanti segnala il giudizio sulla politica economica
    added_by: seed iniziale del progetto

  - id: condono_fiscale
    denotation: provvedimento che riduce o annulla sanzioni e debiti fiscali pregressi
    topic: economia
    terms:
      - term: condono
        connotation: negativo
        note: evoca premio agli evasori e resa dello Stato
      - term: sanatoria
        connotation: negativo
        note: simile a condono, con sfumatura burocratica
      - term: pace fiscale
        connotation: positivo
        note: formula promozionale che presenta il provvedimento come riconciliazione
      - term: rottamazione delle cartelle
        connotation: neutro
        note: metafora ormai tecnicizzata nel lessico normativo
      - term: tregua fiscale
        connotation: positivo
        note: variante che suggerisce sospensione di un conflitto
    rationale: i nomi promozionali coniati dai proponenti competono con i termini critici dell'opposizione
    added_by: seed iniziale del progetto

  - id: imposta_patrimoniale
    denotation: imposta sul patrimonio complessivo delle persone fisiche
    topic: economia
    terms:
      - term: patrimoniale
        connotation: neutro
        note: uso giornalistico standard, spesso già caricato negativamente dal contesto
      - term: imposta sui grandi patrimoni
        connotation: positivo
        note: sottolinea che colpirebbe solo i più ricchi
      - term: esproprio
        connotation: negativo
        note: iperbole che equipara l'imposta alla confisca
    rationale: definire la platea dei contribuenti nel nome stesso della misura ne orienta il consenso
    added_by: seed iniziale del progetto

  - id: accise_carburanti
    denotation: imposte indirette sui carburanti
    topic: economia
    terms:
      - term: accise
        connotation: tecnico
        note: termine giuridico corretto
      - term: pizzo di Stato
        connotation: negativo
        note: paragone con l'estorsione mafiosa usato in polemica politica
      - term: prelievo sui carburanti
        connotation: neutro
        note: descrizione fattuale senza giudizio
    rationale: accostare il fisco all'estorsione criminale delegittima l'imposizione fiscale in sé
    added_by: seed iniziale del progetto

  - id: decessi_sul_lavoro
    denotation: lavoratori che muoiono durante l'attività lavorativa
    topic: lavoro
    terms:
      - term: morti sul lavoro
        connotation: neutro
        note: descrizione diretta del fenomeno
      - term: morti bianche
        connotation: enfatico
        note: formula tradizionale criticata perché attenua le responsabilità
      - term: infortuni mortali
        connotation: tecnico
        note: lessico assicurativo-statistico che spersonalizza
      - term: strage silenziosa
        connotation: enfatico
        note: denuncia la dimensione sistemica e la scarsa attenzione mediatica
      - term: omicidi sul lavoro
        connotation: negativo
        note: formula militante che attribuisce responsabilità penale ai datori
    rationale: tra statistica assicurativa e denuncia, il termine decide se esiste un colpevole
    added_by: seed iniziale del progetto

  - id: lavoro_irregolare
    denotation: attività lavorativa svolta senza contratto e contributi
    topic: lavoro
    terms:
      - term: lavoro nero
        connotation: negativo
        note: formula comune che evoca illegalità, ambigua su chi sia il responsabile
      - term: lavoro sommerso
        connotation: tecnico
        note: lessico economico-statistico
      - term: lavoratori sfruttati
        connotation: enfatico
        note: sposta la responsabilità sul datore di lavoro
      - term: economia informale
        connotation: tecnico
        note: eufemismo accademico che neutralizza l'illegalità
    rationale: il termine scelto distribuisce la colpa tra lavoratore, datore e sistema
    added_by: seed iniziale del progetto

  - id: riduzione_personale
    denotation: riduzione del numero di dipendenti di un'azienda
    topic: lavoro
    terms:
      - term: licenziamenti
        connotation: neutro
        note: termine diretto che nomina l'atto e le persone colpite
      - term: esuberi
        connotation: tecnico
        note: eufemismo aziendale che presenta le persone come eccedenza contabile
      - term: tagli al personale
        connotation: negativo
        note: metafora chirurgica che evoca sacrificio imposto
      - term: ristrutturazione
        connotation: tecnico
        note: eufemismo manageriale che nasconde l'impatto umano
      - term: piano di razionalizzazione
        connotation: tecnico
        note: lessico aziendalese che presenta i licenziamenti come ottimizzazione
    rationale: l'aziendalese trasforma persone licenziate in voci di bilancio da ottimizzare
    added_by: seed iniziale del progetto

  - id: lavoro_precario
    denotation: rapporti di lavoro a termine, discontinui o poco tutelati
    topic: lavoro
    terms:
      - term: precariato
        connotation: negativo
        note: sottolinea insicurezza e fragilità esistenziale
      - term: lavoro flessibile
        connotation: positivo
        note: cornice che presenta la discontinuità come libertà e dinamismo
      - term: contratti atipici
        connotation: tecnico
        note: lessico giuslavoristico neutro
    rationale: la stessa condizione contrattuale è denunciata come precarietà o celebrata come flessibilità
    added_by: seed iniziale del progetto

  - id: gruppi_giovanili_violenti
    denotation: gruppi di minorenni o giovanissimi autori di reati o aggressioni
    topic: giustizia
    terms:
      - term: baby gang
        connotation: negativo
        note: anglicismo allarmistico che criminalizza in blocco e suggerisce organizzazione stabile
      - term: bande giovanili
        connotation: neutro
        note: descrizione più sobria dello stesso fenomeno
      - term: gruppi di minorenni
        connotation: neutro
        note: formula fattuale che evita l'etichetta criminale
      - term: giovani
        connotation: neutro
        note: usato quando si vuole attenuare la gravità dei fatti
    rationale: l'etichetta baby gang costruisce un'emergenza criminale, la perifrasi la dissolve
    added_by: seed iniziale del progetto

  - id: uccisione_donna
    denotation: uccisione di una donna da parte di partner, ex partner o familiare
    topic: giustizia
    terms:
      - term: femminicidio
        connotation: tecnico
        note: termine che nomina la matrice di genere del delitto, ormai accolto nei dizionari
      - term: omicidio
        connotation: neutro
        note: termine generico che non registra la specificità del fenomeno
      - term: delitto passionale
        connotation: negativo
        note: formula deprecata che romanticizza e attenua la responsabilità dell'autore
      - term: dramma della gelosia
        connotation: negativo
        note: cornice giustificatoria che sposta il focus sul movente sentimentale
      - term: raptus
        connotation: negativo
        note: pseudo-spiegazione medica che deresponsabilizza l'omicida
    rationale: le formule romanticizzanti spostano la colpa sulla relazione, il termine specifico la tiene sull'autore
    added_by: seed iniziale del progetto
    references: ["Accademia della Crusca"]

  - id: omicidio_stradale
    denotation: uccisione di una persona causata da un conducente
    topic: giustizia
    terms:
      - term: omicidio stradale
        connotation: tecnico
        note: fattispecie penale introdotta nel 2016
      - term: pirata della strada
        connotation: negativo
        note: etichetta usata soprattutto in caso di fuga del conducente
      - term: incidente mortale
        connotation: neutro
        note: presenta l'evento come fatalità senza responsabili
      - term: tragedia della strada
        connotation: enfatico
        note: cornice fatalistica che rimuove la condotta colposa
    rationale: tra fatalità e reato, il lessico decide se cercare un colpevole o compiangere il destino
    added_by: seed iniziale del progetto

  - id: persone_detenute
    denotation: persone che scontano una pena o una misura cautelare in carcere
    topic: giustizia
    terms:
      - term: detenuti
        connotation: neutro
        note: termine standard
      - term: carcerati
        connotation: negativo
        note: variante popolare con sfumatura spregiativa
      - term: ristretti
        connotation: tecnico
        note: lessico penitenziario-amministrativo
      - term: galeotti
        connotation: negativo
        note: termine arcaico e stigmatizzante
    rationale: il grado di stigma del termine riflette l'idea di pena come vendetta o come rieducazione
    added_by: seed iniziale del progetto

  - id: gestazione_per_altri
    denotation: pratica in cui una donna porta avanti una gravidanza per conto di altri
    topic: diritti civili
    terms:
      - term: utero in affitto
        connotation: negativo
        note: metafora mercantile che presenta la pratica come compravendita del corpo
      - term: maternità surrogata
        connotation: neutro
        note: termine di uso comune relativamente descrittivo
      - term: gestazione per altri
        connotation: tecnico
        note: formula preferita da chi difende la pratica, ne sottolinea la dimensione solidale
      - term: gpa
        connotation: tecnico
        note: sigla che neutralizza ulteriormente la carica emotiva
    rationale: la metafora dell'affitto e la sigla tecnica sono i due poli di una battaglia lessicale esplicita
    added_by: seed iniziale del progetto

  - id: questioni_di_genere
    denotation: studi e politiche relativi all'identità di genere
    topic: diritti civili
    terms:
      - term: teoria gender
        connotation: negativo
        note: etichetta polemica che presenta gli studi di genere come ideologia da imporre
      - term: ideologia gender
        connotation: negativo
        note: variante ancora più marcata della precedente
      - term: identità di genere
        connotation: tecnico
        note: concetto usato in psicologia e nel diritto
      - term: studi di genere
        connotation: tecnico
        note: denominazione accademica del campo di ricerca
    rationale: trasformare un campo di studi in una teoria o ideologia lo presenta come minaccia e non come sapere
    added_by: seed iniziale del progetto

  - id: matrimonio_stesso_sesso
    denotation: unione coniugale tra persone dello stesso sesso
    topic: diritti civili
    terms:
      - term: nozze gay
        connotation: neutro
        note: formula giornalistica breve, con effetto di etichettatura del gruppo
      - term: matrimonio egualitario
        connotation: positivo
        note: cornice che presenta l'istituto come questione di uguaglianza
      - term: matrimonio tra persone dello stesso sesso
        connotation: neutro
        note: descrizione fattuale estesa
    rationale: egualitario incorpora la tesi favorevole nel nome stesso dell'istituto
    added_by: seed iniziale del progetto

  - id: interruzione_gravidanza
    denotation: interruzione volontaria di una gravidanza
    topic: diritti civili
    terms:
      - term: aborto
        connotation: neutro
        note: termine comune, usato con carica negativa nei contesti militanti contrari
      - term: interruzione volontaria di gravidanza
        connotation: tecnico
        note: formula della legge 194, sigla ivg
      - term: soppressione del nascituro
        connotation: negativo
        note: formula del lessico militante contrario, presuppone la personalità del feto
    rationale: la scelta tra lessico sanitario e lessico morale presuppone già una risposta sulla natura del feto
    added_by: seed iniziale del progetto

  - id: fine_vita
    denotation: pratiche mediche che anticipano o accompagnano la morte di malati gravi consenzienti
    topic: diritti civili
    terms:
      - term: eutanasia
        connotation: neutro
        note: termine storico, per alcuni carico di associazioni negative
      - term: suicidio assistito
        connotation: tecnico
        note: fattispecie giuridica distinta dall'eutanasia attiva
      - term: fine vita
        connotation: neutro
        note: iperonimo attenuativo usato nel dibattito parlamentare
      - term: dolce morte
        connotation: enfatico
        note: formula giornalistica eufemistica e sentimentale
      - term: morte assistita
        connotation: neutro
        note: variante descrittiva intermedia
    rationale: l'oscillazione tra tecnicismi e eufemismi misura il disagio culturale verso il tema
    added_by: seed iniziale del progetto

  - id: attivisti_clima
    denotation: attivisti che compiono azioni dimostrative per la causa climatica
    topic: ambiente
    terms:
      - term: eco-vandali
        connotation: negativo
        note: riduce l'azione politica a danneggiamento gratuito
      - term: eco-teppisti
        connotation: negativo
        note: variante che criminalizza gli autori
      - term: eco-attivisti
        connotation: neutro
        note: registra la motivazione ambientale senza giudizio
      - term: attivisti per il clima
        connotation: neutro
        note: formula descrittiva estesa
      - term: ambientalisti
        connotation: neutro
        note: iperonimo generico, talvolta usato con sfumatura ironica
    rationale: nominare il gesto come vandalismo o come attivismo decide se la notizia è cronaca nera o politica
    added_by: seed iniziale del progetto

  - id: scetticismo_climatico
    denotation: posizioni che negano o ridimensionano il cambiamento climatico di origine umana
    topic: ambiente
    terms:
      - term: negazionisti climatici
        connotation: negativo
        note: accosta la posizione al negazionismo storico
      - term: scettici del clima
        connotation: neutro
        note: presenta la posizione come dubbio legittimo
    rationale: scettico nobilita come dubbio scientifico ciò che negazionista bolla come rifiuto dei fatti
    added_by: seed iniziale del progetto

  - id: politiche_verdi
    denotation: politiche di riduzione delle emissioni e riconversione ecologica
    topic: ambiente
    terms:
      - term: transizione ecologica
        connotation: tecnico
        note: denominazione ufficiale europea e ministeriale
      - term: svolta green
        connotation: positivo
        note: anglicismo promozionale
      - term: follia green
        connotation: negativo
        note: formula polemica che presenta le politiche come irrazionali e costose
    rationale: lo stesso pacchetto normativo è progresso o follia a seconda dell'aggettivo
    added_by: seed iniziale del progetto

  - id: impianto_rifiuti
    denotation: impianto che brucia rifiuti producendo energia
    topic: ambiente
    terms:
      - term: termovalorizzatore
        connotation: positivo
        note: sottolinea il recupero energetico, preferito dai sostenitori
      - term: inceneritore
        connotation: negativo
        note: sottolinea la combustione e le emissioni, preferito dagli oppositori
    rationale: caso di scuola italiano di come il nome dell'impianto incorpori il giudizio sull'impianto
    added_by: seed iniziale del progetto

  - id: conflitto_armato
    denotation: attacco militare su larga scala di uno Stato contro un altro
    topic: esteri
    terms:
      - term: guerra
        connotation: neutro
        note: termine diretto
      - term: invasione
        connotation: negativo
        note: attribuisce chiaramente l'aggressione a una parte
      - term: conflitto
        connotation: neutro
        note: termine simmetrico che non nomina l'aggressore
      - term: operazione militare speciale
        connotation: tecnico
        note: eufemismo della propaganda russa per l'invasione dell'Ucraina
      - term: crisi
        connotation: neutro
        note: attenuativo che deresponsabilizza tutte le parti
    rationale: riprendere o rifiutare il lessico dei belligeranti è una scelta editoriale con effetti di legittimazione
    added_by: seed iniziale del progetto

  - id: attacco_aereo
    denotation: attacco militare condotto con aerei, missili o droni
    topic: esteri
    terms:
      - term: bombardamento
        connotation: neutro
        note: termine diretto che evoca distruzione
      - term: raid
        connotation: tecnico
        note: anglicismo che suggerisce rapidità e precisione chirurgica
      - term: attacco aereo
        connotation: neutro
        note: descrizione fattuale
      - term: attacco mirato
        connotation: positivo
        note: riprende la cornice della precisione proposta da chi attacca
    rationale: raid e mirato attenuano la distruzione, bombardamento la mostra
    added_by: seed iniziale del progetto

  - id: governo_estero_ostile
    denotation: governo di uno Stato estero
    topic: esteri
    terms:
      - term: governo
        connotation: neutro
        note: termine standard che implica legittimità ordinaria
      - term: esecutivo
        connotation: tecnico
        note: variante istituzionale
      - term: regime
        connotation: negativo
        note: riservato ai governi considerati autoritari o ostili
      - term: giunta
        connotation: negativo
        note: usato soprattutto per i governi golpisti militari
    rationale: la stampa chiama regime quasi solo i governi sgraditi, misurando così il proprio allineamento
    added_by: seed iniziale del progetto

  - id: combattenti_irregolari
    denotation: combattenti armati non statali
    topic: esteri
    terms:
      - term: terroristi
        connotation: negativo
        note: delegittima totalmente la causa e i mezzi
      - term: miliziani
        connotation: neutro
        note: registra l'appartenenza a una milizia senza giudizio esplicito
      - term: ribelli
        connotation: neutro
        note: suggerisce opposizione a un potere costituito, talvolta con simpatia
      - term: combattenti
        connotation: neutro
        note: termine più neutro disponibile
      - term: partigiani
        connotation: positivo
        note: evoca la resistenza legittima contro l'occupante
    rationale: lo stesso gruppo armato cambia natura morale a seconda dell'etichetta scelta dalla redazione
    added_by: seed iniziale del progetto

  - id: vittime_civili
    denotation: civili uccisi in operazioni militari
    topic: esteri
    terms:
      - term: vittime civili
        connotation: neutro
        note: descrizione fattuale
      - term: danni collaterali
        connotation: tecnico
        note: eufemismo militare che spersonalizza i morti
      - term: strage di civili
        connotation: enfatico
        note: denuncia la gravità e suggerisce intenzionalità o sproporzione
    rationale: l'eufemismo militare e la denuncia enfatica raccontano gli stessi corpi in modi opposti
    added_by: seed iniziale del progetto

  - id: classe_politica
    denotation: insieme delle persone che ricoprono cariche politiche
    topic: politica
    terms:
      - term: politici
        connotation: neutro
        note: termine standard
      - term: classe politica
        connotation: neutro
        note: variante sociologica
      - term: casta
        connotation: negativo
        note: presenta i politici come ceto privilegiato e chiuso, popolarizzato dal libro omonimo del 2007
      - term: palazzo
        connotation: negativo
        note: metonimia che evoca distanza dal paese reale
    rationale: casta e palazzo incorporano la tesi antipolitica nel lessico di cronaca
