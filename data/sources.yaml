# Catalogo delle fonti di Open News.
#
# Regole del catalogo:
# - feed_urls: URL RSS/Atom canonici. La verifica via HTTP reale avviene con
#   `make verify-feeds` (scripts/verify_feeds.py), che aggiorna `enabled`,
#   `disabled_reason` e `last_checked`. I feed non ancora verificati hanno
#   verified: false.
# - wikidata_qid: SOLO se certo; altrimenti null (mai un dato inventato).
#   `scripts/enrich_wikidata.py` può completarlo interrogando Wikidata.
# - terms_note: restrizioni note dei termini d'uso rilevanti per un
#   aggregatore che mostra titolo + snippet breve + link. Non è un parere
#   legale; vedi docs/LEGAL.md.
# - Le fonti senza RSS pubblico (Reuters, AP) hanno feed_urls: [] e vengono
#   coperte solo via GDELT DOC 2.0 (con citazione, vedi NOTICE).

