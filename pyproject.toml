[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opennews"
version = "0.1.0"
description = "Open News — aggregatore di notizie open source che rende visibile chi finanzia l'informazione, come ogni testata seleziona e racconta le notizie, e che cosa ciascuna ignora."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Open News contributors" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pgvector>=0.2.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "PyYAML>=6.0",
    "APScheduler>=3.10",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "trafilatura>=1.9",
    "markdown>=3.6",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# Extra ML opzionali: il sistema funziona senza (fallback deterministici documentati
# in docs/METHODOLOGY.md); con questi extra la qualità di embedding/NER/lingua migliora.
ml = [
    "sentence-transformers>=3.0",
    "lingua-language-detector>=2.0",
    "spacy>=3.7",
    "scikit-learn>=1.4",
    "joblib>=1.4",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-Markdown",
    "pre-commit>=3.7",
]
e2e = [
    "playwright>=1.44",
    "pytest-playwright>=0.5",
]
translate = [
    "argostranslate>=1.9",
]

[tool.setuptools]
packages = { find = { include = ["core*", "apps*"] } }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# Tipografia italiana legittima nei testi: apostrofo tipografico, ×, trattini.
allowed-confusables = ["’", "×", "–", "à", "è", "é", "ì", "ò", "ù", "α"]
ignore = [
    "SIM108", # ternary non sempre più leggibile
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^\\.venv/", "^alembic/versions/"]

[[tool.mypy.overrides]]
module = [
    "feedparser.*",
    "trafilatura.*",
    "apscheduler.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:feedparser.*",
]
markers = [
    "e2e: test end-to-end con browser (esclusi di default)",
]
addopts = "-m 'not e2e'"

[tool.coverage.run]
source = ["core"]
omit = ["core/models/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
