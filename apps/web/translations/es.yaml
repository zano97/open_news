# --- Mapa de cocobertura ---
mappa.titolo: "El mapa de cocobertura"
mappa.occhiello: "Cada punto es una cabecera. Dos cabeceras están cerca si han cubierto las mismas story en los últimos 30 días. <strong>Los ejes no tienen un significado predefinido</strong>: emergen de los datos (análisis de componentes principales) y deben interpretarse mirando las story que los separan, enumeradas debajo. Este mapa no asigna ninguna etiqueta política."
mappa.calcolata: "Calculada ahora mismo sobre {story} story compartidas por {fonti} fuentes; varianza explicada: dim. 1 = {v1}%, dim. 2 = {v2}%. Método: cocoverage-pca-v1 (<a href=\"/metodo\">cómo lo calculamos</a>)."
mappa.x_pos: "Story que empujan hacia la derecha en la dimensión 1"
mappa.x_neg: "Story que empujan hacia la izquierda en la dimensión 1"
mappa.y_pos: "Story que empujan hacia arriba en la dimensión 2"
mappa.y_neg: "Story que empujan hacia abajo en la dimensión 2"
mappa.carico: "(carga {l})"

