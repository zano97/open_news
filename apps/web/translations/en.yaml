mappa.titolo: "The co-coverage map"
mappa.occhiello: "Every dot is an outlet. Two outlets sit close together if they covered the same stories over the last 30 days. <strong>The axes have no predefined meaning</strong>: they emerge from the data (principal component analysis) and must be read through the stories that separate them, listed below. No political label is assigned by this map."
