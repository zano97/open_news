annota.reg_titolo: "Become an annotator"
annota.reg_occhiello: "Annotators judge headlines and snippets <strong>without knowing which outlet they come from</strong>. Declaring your own orientation is part of the protocol: it ensures published labels arise from agreement between people with different orientations, and it weights the judgements. The declaration is public only in aggregate, anonymous form."
