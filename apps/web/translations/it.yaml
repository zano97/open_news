# --- Mappa di co-copertura ---
mappa.titolo: "La mappa di co-copertura"
mappa.occhiello: "Ogni punto è una testata. Due testate sono vicine se hanno coperto le stesse story negli ultimi 30 giorni. <strong>Gli assi non hanno un significato prefissato</strong>: emergono dai dati (analisi delle componenti principali) e vanno interpretati guardando le story che li separano, elencate sotto. Nessuna etichetta politica viene assegnata da questa mappa."
mappa.calcolata: "Calcolata ora su {story} story condivise da {fonti} fonti; varianza spiegata: dim. 1 = {v1}%, dim. 2 = {v2}%. Metodo: cocoverage-pca-v1 (<a href=\"/metodo\">come lo calcoliamo</a>)."
mappa.x_pos: "Story che spingono a destra della dimensione 1"
mappa.x_neg: "Story che spingono a sinistra della dimensione 1"
mappa.y_pos: "Story che spingono in alto della dimensione 2"
mappa.y_neg: "Story che spingono in basso della dimensione 2"
