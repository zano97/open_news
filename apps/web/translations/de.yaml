# --- Ko-Abdeckungskarte ---
mappa.titolo: "Die Ko-Abdeckungskarte"
mappa.occhiello: "Jeder Punkt ist ein Medium. Zwei Medien liegen nahe beieinander, wenn sie in den letzten 30 Tagen dieselben Storys aufgegriffen haben. <strong>Die Achsen haben keine vorgegebene Bedeutung</strong>: Sie ergeben sich aus den Daten (Hauptkomponentenanalyse) und sind anhand der Storys zu lesen, die sie trennen — unten aufgelistet. Diese Karte vergibt kein politisches Etikett."
mappa.calcolata: "Soeben berechnet auf {story} geteilten Storys von {fonti} Quellen; erklärte Varianz: Dim. 1 = {v1} %, Dim. 2 = {v2} %. Methode: cocoverage-pca-v1 (<a href=\"/metodo\">wie wir es berechnen</a>)."
mappa.x_pos: "Storys, die auf Dimension 1 nach rechts ziehen"
mappa.x_neg: "Storys, die auf Dimension 1 nach links ziehen"
mappa.y_pos: "Storys, die auf Dimension 2 nach oben ziehen"
mappa.y_neg: "Storys, die auf Dimension 2 nach unten ziehen"
mappa.carico: "(Ladung {l})"

