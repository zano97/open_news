annota.reg_titolo: "Annotator werden"
annota.reg_occhiello: "Annotatoren bewerten Schlagzeilen und Textauszüge, <strong>ohne zu wissen, von welchem Medium sie stammen</strong>. Die eigene Orientierung zu erklären ist Teil des Protokolls: Es stellt sicher, dass veröffentlichte Etiketten aus der Übereinstimmung von Personen mit unterschiedlichen Orientierungen entstehen, und dient der Gewichtung der Urteile. Die Erklärung ist nur in aggregierter, anonymer Form öffentlich."
