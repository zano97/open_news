annota.reg_titolo: "Devenez annotateur"
annota.reg_occhiello: "Les annotateurs évaluent titres et extraits <strong>sans savoir de quel média ils proviennent</strong>. Déclarer sa propre orientation fait partie du protocole : cela garantit que les étiquettes publiées naissent de l'accord entre des personnes d'orientations différentes, et cela sert à pondérer les jugements. La déclaration n'est publique que sous forme agrégée et anonyme."
