# --- Carte de co-couverture ---
mappa.titolo: "La carte de co-couverture"
mappa.occhiello: "Chaque point est un média. Deux médias sont proches s'ils ont couvert les mêmes stories au cours des 30 derniers jours. <strong>Les axes n'ont pas de signification prédéfinie</strong> : ils émergent des données (analyse en composantes principales) et doivent être interprétés à la lumière des stories qui les séparent, listées ci-dessous. Aucune étiquette politique n'est attribuée par cette carte."
mappa.calcolata: "Calculée à l'instant sur {story} stories partagées par {fonti} sources ; variance expliquée : dim. 1 = {v1} %, dim. 2 = {v2} %. Méthode : cocoverage-pca-v1 (<a href=\"/metodo\">comment nous le calculons</a>)."
mappa.x_pos: "Stories qui tirent vers la droite de la dimension 1"
mappa.x_neg: "Stories qui tirent vers la gauche de la dimension 1"
mappa.y_pos: "Stories qui tirent vers le haut de la dimension 2"
mappa.y_neg: "Stories qui tirent vers le bas de la dimension 2"
mappa.carico: "(poids {l})"

