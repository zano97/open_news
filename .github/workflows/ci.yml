name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check core apps tests scripts

      - name: Mypy (strict)
        run: mypy core apps

      - name: Pytest (coverage core >= 80%)
        run: pytest --cov=core --cov-report=term-missing

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"
          playwright install --with-deps chromium

      - name: Playwright e2e
        run: pytest -m e2e --no-cov
